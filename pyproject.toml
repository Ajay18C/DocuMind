[project]
name = "documind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.1",
    "alembic>=1.18.5",
    "alembic-postgresql-enum>=1.10.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.0",
    "greenlet>=3.5.3",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.4.1",
    "litellm>=1.95.0",
    "numpy>=2.5.0",
    "paddleocr>=3.0",
    "paddlepaddle>=3.3.1",
    "pgvector>=0.4.2",
    "pypdfium2>=5.11.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "poethepoet>=0.30",
]

[tool.poe.tasks]
dev = "uv run fastapi dev src/main.py"
migrate = "alembic upgrade head"
makemigration = "alembic revision --autogenerate -m"
